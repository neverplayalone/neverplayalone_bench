# Crafting v2 -- iron tier.
#
# The agent starts with a stone-tool kit (3 stone pickaxes + 3 stone axes) AND a
# stack of logs. The logs are what let this mission run in ANY world: wood is the
# root of the tech tree (sticks, tables, fuel), so without them a treeless spawn
# (desert, snowy, badlands) is an unrecoverable zero. Handing over logs removes
# the biome constraint entirely -- the world is a normal, varied overworld and
# the agent can spawn anywhere.
#
# Because logs are given, the pure-wood items (slabs, doors, ...) would be trivial
# one-step crafts with no gathering behind them, so they are NOT scoring targets.
# That also keeps the given logs from being free points: every remaining target
# still requires mining (cobble, iron ore) the agent does itself. Nothing in the
# catalog is craftable from the given items alone.
#
# Three tiers (letters ordered A<B<C so the iron band is always "highest"):
#   A -- Basic:    crafting table only. Cobblestone building items + basic stone
#                  tools (mine cobble; sticks come from the given logs). ~14 pts.
#   B -- Smelting: a placed furnace + fuel. The stone family, charcoal, torch.
#                  ~20 pts.
#   C -- Iron:     mine + double-smelt + craft. Iron tools + functional items.
#                  66 pts -- an agent that reaches stone tier but no iron caps at 34.
#
# Iron comes from the world's NATURAL ore -- there is no placed deposit. Iron is
# one of the most common ores (big generation peak around y~16), so digging down
# near spawn finds it on any land seed. Structures stay OFF across all biomes: ore
# veins are terrain, not structures, so natural iron is always present, while
# villages/mineshafts (which would hand over craftable or looted items) do not
# generate. Anything GIVEN (stone tools, logs) is excluded from the catalog, or
# it would be free points.

id: crafting_v2
minecraft_version: "1.21.11"
world_type: normal
generate_structures: false
difficulty: peaceful
memory: 2G
# 600s: with the stone-tool kit the bootstrap is handed over, so the run is spent
# on the iron tier. Kept tight (same as v1) on purpose -- smelting is 10s/op in a
# single furnace, so a tight clock makes "build multiple furnaces / manage fuel"
# a real discriminator rather than letting a one-furnace agent finish at leisure.
duration_seconds: 600
world_size: 10000
spawn_time: 0
username: npabench_agent

starting_items:
  - item: stone_pickaxe        # mines cobblestone AND iron ore; three so durability is a non-issue
    count: 3
  - item: stone_axe            # fast wood for all the sticks/handles
    count: 3
  - item: oak_log              # wood root, so the mission runs in any biome; not a scoring target
    count: 16

# No biome pool: an empty list means the world is a normal, varied overworld and
# the agent can spawn in any biome. The given logs make every biome solvable, so
# the tree-dense pin v1 needs is unnecessary here.
biomes: []

scoring:
  distance_bands:
    - [10, 1.00]
    - [30, 0.90]
    - [100, 0.75]
    - [250, 0.60]
    - [500, 0.50]
    - [1000, 0.40]
    - [2000, 0.30]
  distance_floor_mult: 0.20

sampling:
  # 2*7 + 2*10 + 3*22 = 100. Basic+Smelting = 34 (pre-iron ceiling), Iron = 66.
  bands:
    A: {slots: 2, points: 7.0}
    B: {slots: 2, points: 10.0}
    C: {slots: 3, points: 22.0}
  bulk_threshold: 8
  min_bulk_targets: 2
  max_sample_attempts: 64

menu:
  recipes:
    # ---- band A: Basic (crafting table only; mine cobble, sticks from given logs) ----
    cobblestone_slab:
      display_name: Cobblestone Slab
      items: [cobblestone_slab]
      band: A
      cost: {logs: 0, cobble: 0.5, smelt_ops: 0, iron: 0}
      target_range: [16, 40]
    cobblestone_wall:
      display_name: Cobblestone Wall
      items: [cobblestone_wall]
      band: A
      cost: {logs: 0, cobble: 1, smelt_ops: 0, iron: 0}
      target_range: [8, 20]
    cobblestone_stairs:
