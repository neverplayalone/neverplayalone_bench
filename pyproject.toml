[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neverplayalone-bench"
version = "0.1.0"
description = "Benchmark harness for mineflayer-style Minecraft agents on real servers"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
    "mcrcon>=0.7.0",
    "rich>=13.7",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
npabench = "npabench.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["npabench*"]

[tool.setuptools.package-data]
"npabench.missions.resource_gathering" = ["configs/*.yaml"]
"npabench.missions.crafting_v2" = ["configs/*.yaml"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"
